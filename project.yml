name: Hyperclip
options:
  bundleIdPrefix: dev.alexis
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Hyperclip:
    type: application
    platform: macOS
    sources:
      - path: Hyperclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alexis.Hyperclip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hyperclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Hyperclip transcribes your videos on this Mac to find and caption clips.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
